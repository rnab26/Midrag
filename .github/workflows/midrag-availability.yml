name: Midrag - maintien de disponibilité

on:
  schedule:
    # Filet de sécurité : le déclencheur principal est un cron externe qui
    # appelle workflow_dispatch tous les quarts d'heure (les schedules GitHub
    # sont souvent retardés). Large marge avant l'expiration d'1h de
    # "disponible maintenant".
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Le job ouvre/referme une issue de suivi quand le bot ne peut plus travailler
# (token Midrag expiré, API en panne) au lieu d'échouer à chaque exécution.
permissions:
  contents: read
  issues: write

jobs:
  ping-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r midrag_bot/requirements.txt

      - name: Repointer la disponibilité si besoin
        env:
          MIDRAG_TOKEN: ${{ secrets.MIDRAG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python midrag_bot/bot.py
