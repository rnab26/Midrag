# Configuration du bot de disponibilité Midrag
# Généré par la page docs/index.html — modifie via cette page plutôt qu'à la main.

timezone: "Asia/Jerusalem"

sector_id: 21

# Combien de jours avant l'expiration du token Midrag une issue
# d'avertissement est ouverte (réglable depuis la page de configuration).
token_alert_days: 3

# Heure (Asia/Jerusalem) de la notification quotidienne de rappel du token
# (réglable depuis la page de configuration).
notify_hour: 9

# Combien de jours avant la fin du planning une issue d'avertissement est
# ouverte (réglable depuis la page de configuration).
planning_alert_days: 2

